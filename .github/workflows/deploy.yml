name: Deploy

on:
  push:
    branches: [main]

# Required for Workload Identity Federation
permissions:
  contents: read
  id-token: write

jobs:
  deploy-membership-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Bundle shared code into function directory
        run: cp -r common functions/membership_sync/

      - name: Deploy membership-sync
        run: |
          gcloud functions deploy membership-sync \
            --gen2 \
            --runtime python311 \
            --region us-central1 \
            --source functions/membership_sync \
            --entry-point membership_sync \
            --trigger-topic membership-sync \
            --timeout 540s \
            --memory 512MB \
            --service-account "membership-sync-runner@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --set-secrets "\
          SFDC_URL=sfdc-url:latest,\
          SFDC_CLIENT_ID=sfdc-client-id:latest,\
          SFDC_CLIENT_SECRET=sfdc-client-secret:latest,\
          CHECKMEIN_URL=checkmein-url:latest,\
          CHECKMEIN_USERNAME=checkmein-username:latest,\
          CHECKMEIN_PASSWORD=checkmein-password:latest,\
          DISCORD_BOT_TOKEN=discord-bot-token:latest,\
          GROUPS_MEMBERS_EMAIL=groups-members-email:latest,\
          GROUPS_EXCEPTIONS=groups-exceptions:latest,\
          DISCORD_GUILD_TFI_ID=discord-guild-tfi-id:latest,\
          DISCORD_GUILD_TFI_MEMBER_ROLE_ID=discord-guild-tfi-member-role-id:latest\
          "
